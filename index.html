<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>T&L Master Dashboard</title>
<style>
:root { --bg: #0c0e12; --panel: #11151c; --border: #2a2e38; --gold: #d4af37; --text: #e0e0e0; --accent: #8a63f0; }
body { background-color: var(--bg); color: var(--text); font-family: sans-serif; padding: 20px; font-size: 14px; }
.container { max-width: 1000px; margin: auto; background: var(--panel); border: 1px solid var(--border); padding: 20px; position: relative; }
header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent); padding-bottom: 10px; margin-bottom: 20px; }
h1 { color: var(--gold); margin: 0; font-size: 22px; }
.timer-info { font-size: 12px; color: var(--gold); margin-top: 5px; }
.top-controls { display: flex; gap: 10px; align-items: center; }
.char-selector { display: flex; gap: 4px; flex-wrap: wrap; max-width: 300px; justify-content: flex-end; }
.char-btn { background: var(--border); border: 1px solid var(--gold); color: var(--text); padding: 4px 8px; cursor: pointer; font-weight: bold; border-radius: 4px; font-size: 12px; }
.char-btn.active { background: var(--gold); color: var(--bg); }
.grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
.col-left { display: flex; flex-direction: column; gap: 20px; }
.section-header { display: flex; justify-content: space-between; align-items: center; color: var(--gold); border-bottom: 2px solid var(--accent); padding-bottom: 5px; margin-bottom: 10px; font-weight: bold; }
.section-header-right { display: flex; gap: 8px; align-items: center; }

/* Pulsante Edit Mode e Ripristina */
.mode-toggle-btn { background: none; border: 1px solid var(--border); color: var(--text); padding: 2px 6px; cursor: pointer; font-size: 11px; font-weight: bold; }
.mode-toggle-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.reset-defaults-btn { background: none; border: 1px solid var(--border); color: var(--gold); padding: 2px 6px; cursor: pointer; font-size: 11px; font-weight: bold; }
.reset-defaults-btn:hover { background: rgba(212, 175, 55, 0.1); border-color: var(--gold); }

/* Pulsante e Modulo di Aggiunta a comparsa */
.open-add-btn { background: rgba(255,255,255,0.03); border: 1px dashed var(--border); color: var(--gold); width: 100%; padding: 6px; cursor: pointer; font-size: 12px; font-weight: bold; margin-top: 5px; text-align: center; }
.open-add-btn:hover { background: rgba(212, 175, 55, 0.1); border-color: var(--gold); }
.add-modal { background: rgba(0,0,0,0.4); border: 1px solid var(--border); padding: 8px; margin-top: 5px; display: flex; flex-direction: column; gap: 6px; }
.add-modal input { background: rgba(0,0,0,0.5); border: 1px solid var(--border); color: var(--text); padding: 6px; font-size: 12px; }
.add-modal input:focus { border-color: var(--gold); outline: none; }
.add-modal-actions { display: flex; gap: 5px; justify-content: flex-end; }
.add-modal-actions button { padding: 4px 10px; font-size: 12px; font-weight: bold; cursor: pointer; border: 1px solid var(--gold); }
.btn-confirm { background: var(--gold); color: var(--bg); }
.btn-cancel { background: var(--border); color: var(--text); }

/* Stili Drag and Drop e Task */
.task { 
    padding: 8px; 
    background: rgba(255,255,255,0.03); 
    margin-bottom: 5px; 
    cursor: grab; 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    gap: 10px; 
    user-select: none; 
    border: 1px solid transparent;
    transition: background 0.2s, border-color 0.2s;
}
.task:hover {
    background: rgba(255,255,255,0.06);
    border-color: rgba(212, 175, 55, 0.3);
}
.task:active { cursor: grabbing; }
.task.checked { opacity: 0.5; text-decoration: line-through; }
.task.dragging { 
    opacity: 0.3; 
    background: var(--accent);
    border: 1px dashed var(--gold); 
}
.task.drag-over { 
    border-top: 2px solid var(--gold); 
    background: rgba(212, 175, 55, 0.1);
}
.task-content { display: flex; align-items: center; gap: 10px; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.task-actions { display: flex; gap: 6px; align-items: center; }
.action-btn { background: none; border: none; cursor: pointer; font-weight: bold; opacity: 0.6; padding: 0; font-size: 13px; }
.action-btn:hover { opacity: 1; }
.edit-btn { color: var(--gold); }
.delete-btn { color: #ff5555; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.signature { position: absolute; bottom: 20px; right: 20px; font-size: 12px; color: var(--gold); opacity: 0.7; font-weight: bold; }
.progress-bg { height: 4px; background: #000; margin-bottom: 8px; border-radius: 2px; }
.progress-fill { height: 100%; background: var(--gold); width: 0%; transition: width 0.3s; }
.link-item { color: var(--gold); text-decoration: none; display: block; padding: 8px; background: rgba(255,255,255,0.03); margin-bottom: 5px; border: 1px solid var(--border); transition: 0.2s; }
.link-item:hover { background: rgba(212, 175, 55, 0.1); border-color: var(--gold); }
</style>
</head>
<body>
<div class="container">
<header>
<div>
<h1>⚔️ THRONE AND LIBERTY - MASTER DASHBOARD</h1>
<div class="timer-info" id="timers">⏳ Caricamento timer...</div>
</div>
<div class="top-controls">
    <div class="char-selector" id="char-buttons"></div>
    <button onclick="toggleLang()" style="background:none; border:1px solid var(--border); color:white; cursor:pointer; padding:5px 10px;">🌐 IT / EN</button>
</div>
</header>
<div class="grid">
<div class="col-left">
<div>
<div class="section-header">
    <span id="title-d">☀️ GIORNALIERO</span> 
    <div class="section-header-right">
        <button class="reset-defaults-btn" id="btn-reset-d" onclick="resetDefaults('d')">🔄 Ripristina</button>
        <button class="mode-toggle-btn" id="btn-mode-d" onclick="toggleEditMode('d')">⚙️ Modifica</button>
        <span id="count-d">0/0</span>
    </div>
</div>
<div class="progress-bg"><div id="pb-d" class="progress-fill"></div></div>
<div id="list-d" ondragover="event.preventDefault()"></div>
<div id="container-add-d"></div>
</div>
<div>
<div class="section-header">
    <span id="title-m">🌙 MENSILE</span> 
    <div class="section-header-right">
        <button class="reset-defaults-btn" id="btn-reset-m" onclick="resetDefaults('m')">🔄 Ripristina</button>
        <button class="mode-toggle-btn" id="btn-mode-m" onclick="toggleEditMode('m')">⚙️ Modifica</button>
        <span id="count-m">0/0</span>
    </div>
</div>
<div class="progress-bg"><div id="pb-m" class="progress-fill"></div></div>
<div id="list-m" ondragover="event.preventDefault()"></div>
<div id="container-add-m"></div>
</div>
<div>
<div class="section-header"><span id="title-u">🔗 UTILITY</span></div>
<a href="https://questlog.gg/throne-and-liberty/en/character-builder" target="_blank" class="link-item">📝 Questlog Builder</a>
<a href="https://docs.google.com/document/u/0/d/e/2PACX-1vRlGeaweu5UZXuTPmuN-PAs9VCuCjQzRNyF9VlN3lKZXbfXokKLnyizJh2I2di0Hw6Zg3ixyLXnMp1k/pub?pli=1" target="_blank" class="link-item">🧩 Evento Domande Muro</a>
<a href="https://help.playthroneandliberty.com/hc/en-us/articles/32875866637211-Known-Issues" target="_blank" class="link-item">⚠️ Problemi Noti</a>
<a href="https://www.playthroneandliberty.com/en-us/news" target="_blank" class="link-item">📰 News</a>
</div>
</div>
<div>
<div class="section-header">
    <span id="title-w">🗓️ SETTIMANALE</span> 
    <div class="section-header-right">
        <button class="reset-defaults-btn" id="btn-reset-w" onclick="resetDefaults('w')">🔄 Ripristina</button>
        <button class="mode-toggle-btn" id="btn-mode-w" onclick="toggleEditMode('w')">⚙️ Modifica</button>
        <span id="count-w">0/0</span>
    </div>
</div>
<div class="progress-bg"><div id="pb-w" class="progress-fill"></div></div>
<div id="list-w" class="grid-2" ondragover="event.preventDefault()"></div>
<div id="container-add-w"></div>
</div>
</div>
<div class="signature">CREATO DA DOMINATORITA</div>
</div>
<script>
let lang = 'IT';
let currentCharacter = 1;
const totalCharacters = 6;
let activeAddCat = null;
let editModes = { d: false, w: false, m: false };

const uiTexts = {
    IT: { 
        d: "☀️ GIORNALIERO", 
        m: "🌙 MENSILE", 
        w: "🗓️ SETTIMANALE", 
        u: "🔗 UTILITY",
        edit: "⚙️ Modifica",
        done: "⚙️ Fatto",
        reset: "🔄 Ripristina",
        resetConfirm: "Vuoi ripristinare le voci predefinite per questa sezione? Le modifiche, eliminazioni o aggiunte personalizzate andranno perse.",
        promptEdit: "Modifica il testo della voce:",
        alertExists: "Esiste già una voce con questo nome!",
        deleteConfirm: "Sei sicuro di voler eliminare la voce:",
        addPlaceholder: "Scrivi nuova voce...",
        cancel: "Annulla",
        add: "Aggiungi"
    },
    EN: { 
        d: "☀️ DAILY", 
        m: "🌙 MONTHLY", 
        w: "🗓️ WEEKLY", 
        u: "🔗 UTILITY",
        edit: "⚙️ Edit",
        done: "⚙️ Done",
        reset: "🔄 Reset",
        resetConfirm: "Do you want to restore default items for this section? Custom changes, deletions, or additions will be lost.",
        promptEdit: "Edit item text:",
        alertExists: "An item with this name already exists!",
        deleteConfirm: "Are you sure you want to delete the item:",
        addPlaceholder: "Type new item...",
        cancel: "Cancel",
        add: "Add"
    }
};

const baseDb = {
    d: { 
        IT: ["Comprare Stellarite Talandre", "Comprare contratti e pietre", "Fare Missioni medaglie", "Completa 10 contratti a nix", "Completa 2 Contratti Flames", "Dungeon Elite e Epic", "Solo dungeon nix", "Missioni evento nix (opzionale)", "Comprare Negozio gilda", "Comprare Negozio Cucina"], 
        EN: ["Buy Talandre Stellarite", "Buy contracts & stones", "Do Medallion missions", "Complete 10 Nix contracts", "Complete 2 Flames contracts", "Elite & Epic Dungeons", "Solo Nix dungeon", "Nix event missions (optional)", "Buy Guild Shop", "Buy Cooking Shop"] 
    },
    w: { 
        IT: ["Raid Normal", "Raid Hard", "Raid Nightmare (boss finale)", "Scarico punti Nix", "Hall of illusion", "Trial (punti completamento)", "Trial Golden chest", "Battleground 800 punti", "Battleground 10 win", "Comprare libri Piccioni", "Comprare chiavi Contratti", "Comprare negozio Battleground", "Evento 1", "Contratti mastery torre", "Evento 2", "5 chiavi", "7 Eventi", "Comprare Negozio Gilda", "Comprare Negozio Raid"], 
        EN: ["Raid Normal", "Raid Hard", "Raid Nightmare (final boss)", "Nix points dump", "Hall of illusion", "Trial (completion points)", "Trial Golden chest", "Battleground 800 points", "Battleground 10 wins", "Buy Pigeon books", "Buy Contract tokens", "Buy Battleground shop", "Event 1", "Tower mastery contracts", "Event 2", "5 keys", "7 Events", "Buy Guild Shop", "Buy Raid Shop"] 
    },
    m: { 
        IT: ["Torre", "Evento extra 1", "Evento extra 2"], 
        EN: ["Tower", "Extra event 1", "Extra event 2"] 
    }
};

function initCharButtons() {
    const container = document.getElementById('char-buttons');
    container.innerHTML = "";
    for (let i = 1; i <= totalCharacters; i++) {
        const btn = document.createElement('button');
        btn.id = "btn-char" + i;
        btn.className = "char-btn " + (i === currentCharacter ? "active" : "");
        btn.innerText = "PG " + i;
        btn.onclick = () => switchChar(i);
        container.appendChild(btn);
    }
}

function getStateKey() { return "tl_state_char_" + currentCharacter; }
function getOrderKey(cat) { return "tl_order_char_" + currentCharacter + "_" + cat + "_" + lang; }
function getCustomKey(cat) { return "tl_custom_char_" + currentCharacter + "_" + cat + "_" + lang; }
function getRemovedKey(cat) { return "tl_removed_char_" + currentCharacter + "_" + cat + "_" + lang; }

function loadState() { return JSON.parse(localStorage.getItem(getStateKey()) || "{}"); }
function saveState(state) { localStorage.setItem(getStateKey(), JSON.stringify(state)); }

function getActiveList(cat) {
    let baseList = [...baseDb[cat][lang]];
    let customItems = JSON.parse(localStorage.getItem(getCustomKey(cat)) || "[]");
    let removedItems = JSON.parse(localStorage.getItem(getRemovedKey(cat)) || "[]");
    let savedOrder = JSON.parse(localStorage.getItem(getOrderKey(cat)) || "null");

    let fullList = [...baseList.filter(item => !removedItems.includes(item)), ...customItems];

    if (!savedOrder) return fullList;

    let currentList = [];
    savedOrder.forEach(item => {
        if (fullList.includes(item)) currentList.push(item);
    });
    fullList.forEach(item => {
        if (!currentList.includes(item)) currentList.push(item);
    });
    return currentList;
}

function saveActiveList(cat, list) {
    localStorage.setItem(getOrderKey(cat), JSON.stringify(list));
}

function toggleEditMode(cat) {
    editModes[cat] = !editModes[cat];
    render();
}

function resetDefaults(cat) {
    if (!confirm(uiTexts[lang].resetConfirm)) return;
    localStorage.removeItem(getOrderKey(cat));
    localStorage.removeItem(getCustomKey(cat));
    localStorage.removeItem(getRemovedKey(cat));
    render();
}

function toggleAddModal(cat) {
    activeAddCat = (activeAddCat === cat ? null : cat);
    render();
}

function addTask(cat) {
    const input = document.getElementById('modal-input-' + cat);
    if (!input) return;
    const val = input.value.trim();
    if (!val) return;

    let customItems = JSON.parse(localStorage.getItem(getCustomKey(cat)) || "[]");
    if (!customItems.includes(val)) {
        customItems.push(val);
        localStorage.setItem(getCustomKey(cat), JSON.stringify(customItems));
    }

    let currentList = getActiveList(cat);
    if (!currentList.includes(val)) {
        currentList.push(val);
        saveActiveList(cat, currentList);
    }

    activeAddCat = null;
    render();
}

function editTask(cat, oldItem) {
    let newItem = prompt(uiTexts[lang].promptEdit, oldItem);
    if (newItem === null) return;
    newItem = newItem.trim();
    if (!newItem || newItem === oldItem) return;

    let currentList = getActiveList(cat);
    if (currentList.includes(newItem)) {
        alert(uiTexts[lang].alertExists);
        return;
    }

    let customItems = JSON.parse(localStorage.getItem(getCustomKey(cat)) || "[]");
    let baseList = baseDb[cat][lang];

    if (customItems.includes(oldItem)) {
        let idx = customItems.indexOf(oldItem);
        customItems[idx] = newItem;
        localStorage.setItem(getCustomKey(cat), JSON.stringify(customItems));
    } else if (baseList.includes(oldItem)) {
        let removedItems = JSON.parse(localStorage.getItem(getRemovedKey(cat)) || "[]");
        if (!removedItems.includes(oldItem)) {
            removedItems.push(oldItem);
            localStorage.setItem(getRemovedKey(cat), JSON.stringify(removedItems));
        }
        customItems.push(newItem);
        localStorage.setItem(getCustomKey(cat), JSON.stringify(customItems));
    }

    let indexOrder = currentList.indexOf(oldItem);
    if (indexOrder !== -1) {
        currentList[indexOrder] = newItem;
        saveActiveList(cat, currentList);
    }

    let state = loadState();
    let oldKey = cat + "_" + oldItem;
    let newKey = cat + "_" + newItem;
    if (state[oldKey] !== undefined) {
        state[newKey] = state[oldKey];
        delete state[oldKey];
        saveState(state);
    }

    render();
}

function removeTask(cat, item) {
    if (!confirm(`${uiTexts[lang].deleteConfirm}\n"${item}"?`)) return;

    let customItems = JSON.parse(localStorage.getItem(getCustomKey(cat)) || "[]");
    if (customItems.includes(item)) {
        customItems = customItems.filter(i => i !== item);
        localStorage.setItem(getCustomKey(cat), JSON.stringify(customItems));
    } else {
        let removedItems = JSON.parse(localStorage.getItem(getRemovedKey(cat)) || "[]");
        if (!removedItems.includes(item)) {
            removedItems.push(item);
            localStorage.setItem(getRemovedKey(cat), JSON.stringify(removedItems));
        }
    }

    let currentList = getActiveList(cat);
    currentList = currentList.filter(i => i !== item);
    saveActiveList(cat, currentList);

    let state = loadState();
    delete state[cat + "_" + item];
    saveState(state);

    render();
}

function switchChar(charNum) {
    currentCharacter = charNum;
    activeAddCat = null;
    for (let i = 1; i <= totalCharacters; i++) {
        const btn = document.getElementById('btn-char' + i);
        if (btn) {
            btn.className = "char-btn " + (i === charNum ? "active" : "");
        }
    }
    checkAndReset();
    render();
}

function checkAndReset() {
    let state = loadState();
    const now = new Date();
    const currentHour = now.getHours();
    const referenceDate = new Date(now);
    if (currentHour < 4) referenceDate.setDate(now.getDate() - 1);
    const todayStr = referenceDate.toDateString();
    
    let resetKey = "lastResetDate_char_" + currentCharacter;
    if (localStorage.getItem(resetKey) !== todayStr) {
        Object.keys(state).forEach(k => { if(k.startsWith('d_') || k.startsWith('m_')) delete state[k]; });
        localStorage.setItem(resetKey, todayStr);
        saveState(state);
    }
}

function toggleLang() { 
    lang = (lang === 'IT' ? 'EN' : 'IT'); 
    render(); 
}

function render() {
    let state = loadState();

    document.getElementById('title-d').innerText = uiTexts[lang].d;
    document.getElementById('title-m').innerText = uiTexts[lang].m;
    document.getElementById('title-w').innerText = uiTexts[lang].w;
    document.getElementById('title-u').innerText = uiTexts[lang].u;

    ['d','w','m'].forEach(cat => {
        const btnMode = document.getElementById('btn-mode-' + cat);
        const btnReset = document.getElementById('btn-reset-' + cat);

        if (btnReset) {
            btnReset.innerText = uiTexts[lang].reset;
        }

        if (btnMode) {
            if (editModes[cat]) {
                btnMode.className = "mode-toggle-btn active";
                btnMode.innerText = uiTexts[lang].done;
            } else {
                btnMode.className = "mode-toggle-btn";
                btnMode.innerText = uiTexts[lang].edit;
            }
        }

        const listContainer = document.getElementById('list-' + cat);
        listContainer.innerHTML = "";
        let currentItems = getActiveList(cat);

        currentItems.forEach((item, i) => {
            const key = cat + "_" + item;
            const div = document.createElement("div");
            div.className = "task " + (state[key] ? "checked" : "");
            div.draggable = true;

            div.ondragstart = (e) => {
                e.dataTransfer.setData('text/plain', JSON.stringify({cat: cat, index: i}));
                div.classList.add('dragging');
            };
            div.ondragend = () => { 
                div.classList.remove('dragging');
                document.querySelectorAll('.task').forEach(el => el.classList.remove('drag-over'));
            };
            div.ondragover = (e) => { 
                e.preventDefault(); 
                div.classList.add('drag-over');
            };
            div.ondragleave = () => {
                div.classList.remove('drag-over');
            };
            div.ondrop = (e) => {
                e.preventDefault();
                div.classList.remove('drag-over');
                const data = JSON.parse(e.dataTransfer.getData('text/plain'));
                if (data.cat === cat) {
                    let items = getActiveList(cat);
                    const draggedItem = items.splice(data.index, 1)[0];
                    items.splice(i, 0, draggedItem);
                    saveActiveList(cat, items);
                    render();
                }
            };

            let actionsHtml = "";
            if (editModes[cat]) {
                actionsHtml = `
                    <div class="task-actions">
                        <button class="action-btn edit-btn" title="Modifica" onclick="event.stopPropagation(); editTask('${cat}', '${item.replace(/'/g, "\\'")}')">✏️</button>
                        <button class="action-btn delete-btn" title="Elimina" onclick="event.stopPropagation(); removeTask('${cat}', '${item.replace(/'/g, "\\'")}')">✕</button>
                    </div>
                `;
            }

            div.innerHTML = `
                <div class="task-content" onclick="const s = loadState(); s['${key}'] = !s['${key}']; saveState(s); render();">
                    <input type="checkbox" ${state[key] ? "checked" : ""}> 
                    <span>${item}</span>
                </div>
                ${actionsHtml}
            `;
            listContainer.appendChild(div);
        });

        const addContainer = document.getElementById('container-add-' + cat);
        if (activeAddCat === cat) {
            addContainer.innerHTML = `
                <div class="add-modal">
                    <input type="text" id="modal-input-${cat}" placeholder="${uiTexts[lang].addPlaceholder}" onkeydown="if(event.key==='Enter') addTask('${cat}')">
                    <div class="add-modal-actions">
                        <button class="btn-cancel" onclick="toggleAddModal('${cat}')">${uiTexts[lang].cancel}</button>
                        <button class="btn-confirm" onclick="addTask('${cat}')">${uiTexts[lang].add}</button>
                    </div>
                </div>
            `;
            setTimeout(() => {
                const inp = document.getElementById('modal-input-' + cat);
                if (inp) inp.focus();
            }, 50);
        } else {
            addContainer.innerHTML = `<button class="open-add-btn" onclick="toggleAddModal('${cat}')">+ ADD</button>`;
        }

        const total = currentItems.length;
        const done = currentItems.filter(item => state[cat + "_" + item]).length;
        document.getElementById('count-' + cat).innerText = done + "/" + total;
        document.getElementById('pb-' + cat).style.width = (total > 0 ? (done / total * 100) : 0) + "%";
    });
}

setInterval(() => {
    const now = new Date();
    let nextDaily = new Date(now);
    nextDaily.setHours(4, 0, 0, 0);
    if (now >= nextDaily) {
        nextDaily.setDate(nextDaily.getDate() + 1);
    }
    
    let nextWeekly = new Date(now);
    nextWeekly.setHours(4, 0, 0, 0);
    let day = nextWeekly.getDay();
    let daysUntilThursday = (4 - day + 7) % 7;
    if (daysUntilThursday === 0 && now >= nextWeekly) {
        daysUntilThursday = 7;
    }
    nextWeekly.setDate(nextWeekly.getDate() + daysUntilThursday);

    const f = (ms) => {
        const s = Math.floor(ms / 1000);
        const days = Math.floor(s / 86400);
        const hours = Math.floor((s % 86400) / 3600);
        const mins = Math.floor((s % 3600) / 60);
        const secs = s % 60;
        return days > 0 ? `${days}g ${hours}h ${mins}m ${secs}s` : `${hours}h ${mins}m ${secs}s`;
    };

    document.getElementById("timers").innerText = `⏳ RESET GIORNALIERO: ${f(nextDaily - now)} | RESET SETTIMANALE (GIOVEDÌ): ${f(nextWeekly - now)}`;
}, 1000);

initCharButtons();
checkAndReset();
render();
</script>
</body>
</html>
